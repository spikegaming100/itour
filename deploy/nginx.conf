# Пример конфигурации nginx для сборки под корень сайта.
#
# 1. Соберите проект:  npm ci && npm run build:nginx
# 2. Скопируйте содержимое dist/ на сервер, например в /var/www/itour:
#      rsync -av --delete dist/ user@server:/var/www/itour/
# 3. Подключите этот файл (например, /etc/nginx/conf.d/itour.conf)
#    и перезагрузите nginx:  nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/itour;
    index index.html;

    charset utf-8;

    # Сжатие статики
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf;

    # Ассеты Vite содержат хеш в имени — их можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы после деплоя сразу подхватывалась новая версия
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: неизвестные пути отдаём в index.html
    # (роутинг клиентский, используется HashRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
